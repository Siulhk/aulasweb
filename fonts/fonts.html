<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fontes</title>
    <style>
        @font-face {
            font-family: nadia;
            src: url(../fonts/nadia/nadia-serif.ttf);
        }
        @font-face {
            font-family: astrombo;
            src: url(../fonts/astronbo.ttf);
        }
        @import url('https://fonts.googleapis.com/css2?family=BJ+Cree:wght@400;500;600;700&display=swap');
        h1{
            font-family: nadia, 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif
        }
        .astrombo{
            font-family: astrombo;
        }
        .bj-cree-regular {
  font-family: "BJ Cree", serif;
  font-weight: 400;
  font-style: normal;
}
    </style>
</head>
<body>
    <h1>Font-Face</h1>
    <h1 class="astrombo">Font-Face</h1>
    <h1 class="bj-cree-regular">Font-Face</h1>
</body>
</html>
