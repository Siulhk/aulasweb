<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        input{
            display: block;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
    <form>
        <fieldset>
            <legend>Introdução</legend>
            <input type="email" name="email" required>
            <label for="filhos" id="filhos">Quantidade de filhos</label>
            <input type="number" id="filhos" min="0" mas="10">
            <input type="date" min="2026-04-13">
            <fieldset>
                <legend>Possui comorbidade?</legend>
                <input type="radio" name="comorbidade" value="sim">Sim
                <input type="radio" name="comorbidade" value="não">Não
            </fieldset>
            <fieldset>
                <legend>Interesse</legend>
                <label><input type="checkbox" name="interesse" value="html">HTML</label>
                <label><input type="checkbox" name="interesse" value="css">CSS</label>
                <label><input type="checkbox" name="interesse" value="js">JavaScript</label>
            </fieldset>
            <label>Escolha uma linguagem</label>
            <select name="linguagem" required>
                <option value="" disabled>Selecione uma</option>
                <option value="html">HTML</option>
                <option value="css">CSS</option>
                <option value="js">JavaScript</option>
            </select>
            <label>Escolha uma outra linguagem</label>
            <select>
                <option value="" disabled>Selecione uma</option>
                    <optgroup label="front">
                    <option value="html">HTML</option>
                    <option value="css">CSS</option>
                    <option value="js">JavaScript</option>
                </optgroup>
                <optgroup label="back">
                    <option value="node">NodeJS</option>
                    <option value="laravel">Laravel</option>
                </optgroup>
                <input type="text" list="linguagemList">
                <datalist id="linguagemList">
                    <option value="html">HTML</option>
                    <option value="css">CSS</option>
                    <option value="js">JavaScript</option>
                </datalist>
                <textarea name="msg" cols="100" rows="10" readonly>
Contrato de utilização
    1.1 Clausula 1
    1.2 Clausula 2
                </textarea>
            </select>
            <input type="file">
            <input type="hidden" value="valorEscondido">
            <input type="button" value="Botão">
            <input type="search">
            <input type="range" min="0" max="10">
            <input type="time">
            <input type="color">
            <input type="submit" value="Enviar">
        </fieldset>
    </form>
</body>
</html>
